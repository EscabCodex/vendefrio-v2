# VendeFrío - Dependabot (2026-11-05): revisa una vez por semana si hay
# versiones nuevas de las librerías y junta todo en UN solo pull request
# hacia "desarrollo" (no hacia "main"). Los avisos de seguridad urgentes los
# manda GitHub aparte, apenas se conocen.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: desarrollo
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 2
    groups:
      librerias:
        patterns: ["*"]
    commit-message:
      prefix: "Librerías"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: desarrollo
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: "Acciones de GitHub"
