# Arma el APK del prototipo Flutter de Pedidos (carpeta prototipo-flutter).
# No toca la app de VendeFrío: solo corre cuando cambia esa carpeta y deja el
# APK en la versión (release) "prototipo-flutter" de GitHub para bajarlo al celular.
name: Prototipo Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "prototipo-flutter/lib/**"
      - "prototipo-flutter/pubspec.yaml"
      - "prototipo-flutter/android/**"
      - ".github/workflows/prototipo-flutter-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk vendefrio-pedidos-prototipo.apk
          ls -la
          gh release delete prototipo-flutter --yes --cleanup-tag || true
          gh release create prototipo-flutter --prerelease --target "$GITHUB_SHA" \
            --title "Prototipo Flutter de Pedidos" \
            --notes "Solo para probar la fluidez. Bajá vendefrio-pedidos-prototipo.apk en el celular e instalalo. No toca la app de VendeFrío." \
            vendefrio-pedidos-prototipo.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk
